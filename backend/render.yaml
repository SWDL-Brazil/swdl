services:
  - type: web
    name: swdl
    env: python
    buildCommand: pip install -r requirements.txt && python init_db.py
    startCommand: gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 "app:create_app()" --bind 0.0.0.0:$PORT
    # Disco persistente: uploads (ex. PDFs de certificado) sobrevivem a
    # deploy/restart — o FS do container e efemero e apagava os arquivos
    # enquanto o banco continuava apontando para eles.
    disk:
      name: swdl-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        value: https://swdl-5a3fa.web.app,https://swdl.onrender.com
      - key: CERTIFICATES_DIR
        value: /var/data/certificates