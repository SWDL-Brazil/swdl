{% extends "admin/base.html" %}
{% block title %}{{ 'Editar' if period else 'Novo' }} Período{% endblock %}
{% block page_title %}{{ 'Editar' if period else 'Novo' }} Período{% endblock %}

{% block topbar_actions %}
  <a href="{{ url_for('admin.periods_list') }}" class="btn btn-ghost">← Períodos</a>
{% endblock %}

{% block content %}
<div style="max-width:500px">
  <div class="card">
    <div class="card-body">
      <form method="POST">

        <div class="form-group">
          <label>Nome *</label>
          <input type="text" name="name" required
                 value="{{ period.name if period else '' }}"
                 placeholder="Ex: Inscrições, Ensaios, Evento">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Data Início *</label>
            <input type="date" name="start_date" required
                   value="{{ period.start_date if period else '' }}">
          </div>
          <div class="form-group">
            <label>Data Fim *</label>
            <input type="date" name="end_date" required
                   value="{{ period.end_date if period else '' }}">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Ordem</label>
            <input type="number" name="order" min="0"
                   value="{{ period.order if period else 0 }}">
          </div>
          <div class="form-group">
            <label>Cor</label>
            <select name="color">
              {% for c in [('navy','Azul Escuro'),('gold','Dourado'),('green','Verde'),('blue','Azul'),('red','Vermelho'),('slate','Cinza')] %}
              <option value="{{ c[0] }}" {{ 'selected' if period and period.color == c[0] }}>{{ c[1] }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div style="display:flex;gap:8px">
          <button type="submit" class="btn btn-primary">
            {{ '💾 Salvar' if period else '✅ Criar' }}
          </button>
          <a href="{{ url_for('admin.periods_list') }}" class="btn btn-ghost">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
